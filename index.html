<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Blasto" />
    <meta name="theme-color" content="#f8f5f1" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta property="og:site_name" content="Blasto" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Inter is self-hosted (public/fonts, @font-face in src/index.css). The
         Google Fonts stylesheet used to sit here and blocked the first paint:
         the browser could not render until it had fetched a third-party CSS
         file that itself pointed at a third-party font. Preloading the woff2
         from our own origin starts it in parallel with the CSS instead. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Route-specific tags are injected at the marker below during the build.
         Never hardcode title/description/canonical/JSON-LD above it: a static
         canonical would point every route at the homepage and deindex the rest.
         Source of truth is src/lib/seo.ts; `vite dev` fills this in on the
         client via useDocumentMeta(). This comment is stripped at build. -->
    <!--app-head-->
  </head>

  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
